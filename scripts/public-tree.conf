# Public tree policy, enforced by scripts/check-public-tree.py (pnpm check, the pre-push hook,
# scripts/remote-validate.sh and the publish workflow).
#
# One rule per line, `<kind> <value>`; blank lines and lines starting with `#` are ignored.
#
#   allow-md <glob>        every tracked *.md / *.mdx must match one of these. A new public doc
#                          needs its own line here; anything else belongs in private/.
#   deny <glob>            no tracked path may match, and no pushed commit may add or modify one.
#                          A glob that matches a directory denies everything under it.
#   deny-text <regex>      Python regex; no line of a tracked text file may match (git grep -I).
#   allow-text <literal>   a deny-text match lying inside this literal is exempt (placeholders).
#   old-root <sha>         full sha of a root commit of the history before a rewrite; a pushed ref
#                          that still descends from it is refused.
#
# Globs match repo-relative POSIX paths from the root: `*` and `?` stay within one path segment,
# `**` as a whole segment spans any number of segments (zero included), `[abc]` is a class.
#
# private/public-tree-private.conf, when the private companion is checked out, adds rules in the
# same format. Its violations are reported by rule number, never by pattern.

# ---- pre-rewrite history ---------------------------------------------------------------------
old-root f6058ff1ae90d68539435439143030deee3f61eb

# ---- personal data -------------------------------------------------------------------------
# Steam64 account ids; the documented placeholder is allowed.
deny-text \b7656119[0-9]{10}\b
allow-text 76561197960265729
allow-text 76561198000000000
allow-text 76561198000000001
allow-text 76561198000000002
allow-text 76561198000000123

# ---- internal material ---------------------------------------------------------------------
deny private
deny private/**
deny .ai/**
deny docs/agents/**
deny **/results/**
deny **/handoff-*
deny **/*-handoff.md
deny **/*-design.md
deny **/ledger*
deny **/bench/**/*.ndjson
deny **/benches/**/*.ndjson
deny **/perf/**/*.ndjson

