name: Feature request
description: Suggest an improvement or new CouchCoop capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please describe the problem first so the request can be evaluated even if the proposed solution changes.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult, missing, or frustrating today, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would like CouchCoop to behave.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Who would benefit?
      description: For example, phone players, hosts with older hardware, larger groups, or mod authors.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe anything you currently do instead, if applicable.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, device details, or related links if they help explain the request.
