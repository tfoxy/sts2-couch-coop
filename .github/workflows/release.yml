name: Release mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: sources/couchcoop
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'

      - name: Verify release inputs and policy fixtures
        working-directory: sources/couchcoop
        run: |
          ./scripts/verify-sts2-reference-sdk.sh
          ./scripts/test-verify-release-archive.sh

      # Fails the release when CHANGELOG.md has no section for this tag. Release notes are written
      # by hand from the Changelog: trailers, not generated from commit subjects.
      - name: Verify release notes exist
        working-directory: sources/couchcoop
        run: ./scripts/changelog-section.sh "${{ github.ref_name }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build release archive
        working-directory: sources/couchcoop
        env:
          COUCHCOOP_RELEASE_EXPECTED_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: '! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: sources/couchcoop
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --title "CouchCoop ${{ github.ref_name }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: sources/couchcoop/dist/*.zip
