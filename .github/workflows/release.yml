name: Release mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos-capture:
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source without credentials
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sources/couchcoop
          persist-credentials: false

      - name: Build the pinned universal macOS capture
        timeout-minutes: 50
        working-directory: sources/couchcoop
        run: |
          set -euo pipefail
          url="$(jq -er '.dependencies["godot-scene-web"].repository' release-dependencies.json)"
          commit="$(jq -er '.dependencies["godot-scene-web"].commit' release-dependencies.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git clone --quiet "$url" ../godot-scene-web
          git -C ../godot-scene-web checkout --quiet --detach "$commit"
          test "$(git -C ../godot-scene-web rev-parse HEAD)" = "$commit"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked --manifest-path ../godot-scene-web/experiments/render-stream/rs-net/Cargo.toml
          bash ../godot-scene-web/experiments/render-stream/scripts/build-capture.sh --target macos
          bash ../godot-scene-web/experiments/render-stream/scripts/build-rs-net.sh --target macos
          bundle=../godot-scene-web/experiments/render-stream/capture/build/macos/bundle
          mkdir -p ../macos-capture
          for name in librender_stream_capture.dylib librender_stream_net.dylib render_stream_capture.gdextension build-info.txt; do
            cp "$bundle/$name" ../macos-capture/
          done
          (cd ../macos-capture && shasum -a 256 librender_stream_capture.dylib librender_stream_net.dylib render_stream_capture.gdextension build-info.txt > SHA256SUMS)

      - name: Upload the macOS capture with checksums
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-capture-${{ github.run_id }}
          path: sources/macos-capture/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: macos-capture
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sources/couchcoop
          fetch-depth: 0

      # Refuse to release a tree that fails the public-tree policy (docs/commit-and-release.md).
      - name: Check the public tree
        working-directory: sources/couchcoop
        run: python3 scripts/check-public-tree.py

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Verify release inputs and policy fixtures
        working-directory: sources/couchcoop
        run: |
          ./scripts/verify-sts2-reference-sdk.sh
          ./scripts/test-verify-release-archive.sh
          ./scripts/test-check-render-capture-records.sh

      # Fails the release when CHANGELOG.md has no section for this tag. Release notes are written
      # by hand from the Changelog: trailers, not generated from commit subjects. release-body.sh
      # propagates that failure and appends the note about the one archive a release publishes.
      - name: Verify release notes exist
        working-directory: sources/couchcoop
        run: ./scripts/release-body.sh "${{ github.ref_name }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Set up Rust WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown x86_64-pc-windows-gnullvm
          cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Download the macOS capture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-capture-${{ github.run_id }}
          path: macos-capture/

      - name: Verify the macOS artifact handoff
        run: |
          set -euo pipefail
          cd macos-capture
          sha256sum --check --strict SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          for name in librender_stream_capture.dylib librender_stream_net.dylib render_stream_capture.gdextension build-info.txt; do
            awk -v name="$name" '$2 == name { found = 1 } END { exit !found }' SHA256SUMS
          done

      - name: Build release archive
        working-directory: sources/couchcoop
        env:
          COUCHCOOP_MACOS_CAPTURE_DIR: ${{ github.workspace }}/macos-capture
          COUCHCOOP_RELEASE_EXPECTED_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: '! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: sources/couchcoop
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --title "CouchCoop ${{ github.ref_name }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sources/couchcoop/dist/*.zip
