name: Release mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sources/couchcoop
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4.0.1
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22.x'

      - name: Verify release inputs and policy fixtures
        working-directory: sources/couchcoop
        run: |
          ./scripts/verify-sts2-reference-sdk.sh
          ./scripts/test-verify-release-archive.sh

      - name: Build release archive
        working-directory: sources/couchcoop
        env:
          COUCHCOOP_RELEASE_EXPECTED_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: '! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: sources/couchcoop
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --title "CouchCoop ${{ github.ref_name }}"
          --generate-notes

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: sources/couchcoop/dist/*.zip
