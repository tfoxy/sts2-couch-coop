name: Steam-free macOS and iPhone checks

on:
  workflow_dispatch:
    inputs:
      run_arm:
        description: Run the Apple Silicon macOS package and runtime checks
        required: true
        type: boolean
        default: true
      run_intel:
        description: Run the Intel macOS package and runtime checks
        required: true
        type: boolean
        default: false
  push:
    branches:
      - 'ci/macos'

permissions:
  contents: read

concurrency:
  group: macos-iphone-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without credentials
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check workflow policy
        timeout-minutes: 3
        run: |
          scripts/test-macos-iphone-workflow-policy.sh
          scripts/test-validate-iphone-artifact-stage.sh

      - name: Check shell scripts when ShellCheck is available
        timeout-minutes: 3
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning \
              scripts/lib/release-portable.sh \
              scripts/macos-support-diagnostics.sh \
              scripts/package-release.sh \
              scripts/run-iphone-safari-simulator.sh \
              scripts/test-iphone-safari-simulator.sh \
              scripts/validate-macos-iphone-workflow.sh \
              scripts/test-macos-iphone-workflow-policy.sh \
              scripts/test-validate-iphone-artifact-stage.sh \
              scripts/verify-release-archive.sh \
              scripts/verify-sts2-reference-sdk.sh
          fi

  iphone_webkit:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source without credentials
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: sources/sts2-couch-coop
          persist-credentials: false

      - name: Clone pinned public presentation sources
        timeout-minutes: 8
        working-directory: sources
        run: |
          set -euo pipefail
          pins=sts2-couch-coop/release-dependencies.json
          for name in spirectl godot-scene-web; do
            url="$(jq -er --arg name "$name" '.dependencies[$name].repository' "$pins")"
            commit="$(jq -er --arg name "$name" '.dependencies[$name].commit' "$pins")"
            git clone --quiet "$url" "$name"
            git -C "$name" checkout --quiet --detach "$commit"
            test "$(git -C "$name" rev-parse HEAD)" = "$commit"
          done

      - name: Set up .NET
        timeout-minutes: 4
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node
        timeout-minutes: 4
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'

      - name: Install presentation and frontend dependencies
        timeout-minutes: 12
        run: |
          set -euo pipefail
          corepack enable
          (cd sources/godot-scene-web && corepack pnpm install --frozen-lockfile)
          (cd sources/spirectl/presentation/web && corepack pnpm install --frozen-lockfile)
          npm --prefix sources/sts2-couch-coop/frontend ci

      - name: Install the WebKit browser
        timeout-minutes: 10
        working-directory: sources/sts2-couch-coop/frontend
        run: npx playwright install --with-deps webkit

      - name: Run both hermetic iPhone 13 WebKit profiles
        timeout-minutes: 30
        working-directory: sources/sts2-couch-coop
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          COUCHCOOP_IPHONE_ARTIFACT_DIR="$GITHUB_WORKSPACE/sources/sts2-couch-coop/.ci-artifacts/iphone-webkit" \
            npm --prefix frontend run test:iphone-webkit

      - name: Validate staged WebKit diagnostics
        timeout-minutes: 2
        id: validate_webkit_artifacts
        if: always()
        working-directory: sources/sts2-couch-coop
        run: |
          node scripts/validate-iphone-artifact-stage.mjs webkit .ci-artifacts/iphone-webkit/baseline
          node scripts/validate-iphone-artifact-stage.mjs webkit .ci-artifacts/iphone-webkit/field-repro

      - name: Upload staged synthetic diagnostics
        timeout-minutes: 3
        if: ${{ always() && steps.validate_webkit_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-webkit-synthetic-${{ github.run_id }}
          path: sources/sts2-couch-coop/.ci-artifacts/iphone-webkit
          if-no-files-found: ignore
          retention-days: 3

  macos_arm:
    needs: [policy, iphone_webkit]
    if: ${{ github.event_name == 'push' || inputs.run_arm == true }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Pin a scratch mod directory
        timeout-minutes: 1
        run: echo "COUCHCOOP_GAME_MODS_DIR=$RUNNER_TEMP/couchcoop-mods" >> "$GITHUB_ENV"

      - name: Check out source without credentials
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: sources/sts2-couch-coop
          fetch-depth: 0
          persist-credentials: false

      - name: Clone pinned public release sources
        timeout-minutes: 8
        working-directory: sources
        run: |
          set -euo pipefail
          pins=sts2-couch-coop/release-dependencies.json
          for name in spirectl godot-scene-web; do
            url="$(jq -er --arg name "$name" '.dependencies[$name].repository' "$pins")"
            commit="$(jq -er --arg name "$name" '.dependencies[$name].commit' "$pins")"
            git clone --quiet "$url" "$name"
            git -C "$name" checkout --quiet --detach "$commit"
            test "$(git -C "$name" rev-parse HEAD)" = "$commit"
          done

      - name: Set up .NET
        timeout-minutes: 4
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node
        timeout-minutes: 4
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'

      - name: Download the pinned universal Godot .NET runtime
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v4.5.1-stable_mono_macos.universal.zip"
          godot_root="$RUNNER_TEMP/godot-dotnet-4.5.1"
          curl --fail --location --retry 3 --retry-all-errors --retry-max-time 1200 \
            --connect-timeout 15 --max-time 900 --output "$archive" \
            https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_macos.universal.zip
          expected_sha=f00ee565e9d3682584117ef8865f5ff6d8f571fbf2733075ee06b9e0953261b8
          test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$expected_sha"
          mkdir -p "$godot_root"
          unzip -q "$archive" -d "$godot_root"
          godot_count="$(find "$godot_root" -type f -path '*/Contents/MacOS/Godot' | wc -l | tr -d ' ')"
          test "$godot_count" -eq 1
          godot_executable="$(find "$godot_root" -type f -path '*/Contents/MacOS/Godot')"
          godot_app="${godot_executable%/Contents/MacOS/Godot}"
          test -x "$godot_executable"
          echo "COUCHCOOP_GODOT_EXECUTABLE=$godot_executable" >> "$GITHUB_ENV"
          echo "COUCHCOOP_GODOT_APP=$godot_app" >> "$GITHUB_ENV"

      - name: Audit portable package fixtures and pinned reference lanes
        timeout-minutes: 15
        working-directory: sources/sts2-couch-coop
        run: |
          scripts/verify-sts2-reference-sdk.sh stable public-beta
          scripts/test-verify-release-archive.sh
          scripts/test-macos-support-diagnostics.sh
          scripts/test-iphone-safari-simulator.sh

      - name: Build reference SDKs and public runtime fixtures
        timeout-minutes: 20
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/couchcoop-reference-sdk"
          for lane in stable public-beta; do
            dotnet build "eng/Sts2.ReferenceSdk/$lane/Sts2.ReferenceSdk.$lane.csproj" \
              -c Release -o "$sdk_root/$lane" -p:RestoreLockedMode=true
          done
          dotnet run --project tests/CouchCoop.HostedServerHarness -c Release \
            -p:Sts2AssembliesDir="$sdk_root/stable" -p:Sts2GameApi=v107 \
            -p:CouchCoopBuildToLocalMods=false -- \
            --mode iphone-burst-self-test
          dotnet build tests/CouchCoop.HarmonySmoke/CouchCoop.HarmonySmoke.csproj \
            -c Release -o "$RUNNER_TEMP/couchcoop-harmony-smoke" \
            -p:RestoreLockedMode=true -p:CouchCoopBuildToLocalMods=false
          dotnet restore tests/CouchCoop.MacOs.GodotHarmonyFixture/CouchCoop.MacOs.GodotHarmonyFixture.csproj \
            --locked-mode
          dotnet build tests/CouchCoop.MacOs.GodotHarmonyFixture/CouchCoop.MacOs.GodotHarmonyFixture.csproj \
            -c Release --no-restore
          fixture_stage="$RUNNER_TEMP/CouchCoop Godot Harmony fixture"
          ditto tests/CouchCoop.MacOs.GodotHarmonyFixture "$fixture_stage"
          test -f "$fixture_stage/.godot/mono/temp/bin/Release/CouchCoop.MacOs.GodotHarmonyFixture.dll"
          echo "COUCHCOOP_GODOT_FIXTURE=$fixture_stage" >> "$GITHUB_ENV"

      - name: Verify stable and public-beta lobby targets as metadata only
        timeout-minutes: 10
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          project=tests/CouchCoop.Mod.Tests/CouchCoop.Mod.Tests.csproj
          metadata_obj="$RUNNER_TEMP/couchcoop-beta-targets/obj/"
          metadata_bin="$RUNNER_TEMP/couchcoop-beta-targets/bin/"
          dotnet restore "$project" \
            -p:CouchCoopBetaTargetsMode=metadata \
            -p:CouchCoopLocalConfigPath="$RUNNER_TEMP/no-local-game-config.yaml" \
            -p:BaseIntermediateOutputPath="$metadata_obj" \
            -p:BaseOutputPath="$metadata_bin"
          dotnet run --project "$project" -c Release --no-restore \
            -p:CouchCoopBetaTargetsMode=metadata -p:Sts2GameApi=v107 \
            -p:CouchCoopLocalConfigPath="$RUNNER_TEMP/no-local-game-config.yaml" \
            -p:BaseIntermediateOutputPath="$metadata_obj" -p:BaseOutputPath="$metadata_bin" -- \
            beta-targets "$RUNNER_TEMP/couchcoop-reference-sdk/stable/sts2.dll"
          dotnet run --project "$project" -c Release --no-restore \
            -p:CouchCoopBetaTargetsMode=metadata -p:Sts2GameApi=v111 \
            -p:CouchCoopLocalConfigPath="$RUNNER_TEMP/no-local-game-config.yaml" \
            -p:BaseIntermediateOutputPath="$metadata_obj" -p:BaseOutputPath="$metadata_bin" -- \
            beta-targets "$RUNNER_TEMP/couchcoop-reference-sdk/public-beta/sts2.dll"

      - name: Run game-free macOS and Harmony checks
        timeout-minutes: 15
        working-directory: sources/sts2-couch-coop
        run: |
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- \
            --harmony-smoke "$RUNNER_TEMP/couchcoop-harmony-smoke/CouchCoop.HarmonySmoke"
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- \
            --godot-harmony-fixture "$COUCHCOOP_GODOT_EXECUTABLE" "$COUCHCOOP_GODOT_FIXTURE"

      - name: Run the ad-hoc hardened Godot .NET fixture
        timeout-minutes: 15
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          signed_root="$RUNNER_TEMP/CouchCoop hardened Godot"
          signed_app="$signed_root/$(basename "$COUCHCOOP_GODOT_APP")"
          mkdir -p "$signed_root"
          ditto "$COUCHCOOP_GODOT_APP" "$signed_app"
          codesign --force --deep --sign - --options runtime \
            --entitlements tests/CouchCoop.MacOs.GodotHarmonyFixture/hardened-runtime.entitlements.plist \
            "$signed_app"
          codesign --verify --deep --strict "$signed_app"
          signature="$RUNNER_TEMP/couchcoop-godot-signature.txt"
          codesign --display --verbose=4 "$signed_app" >"$signature" 2>&1
          grep -Fq 'Signature=adhoc' "$signature"
          grep -Eq '^CodeDirectory .*flags=.*\([^)]*runtime[^)]*\)' "$signature"
          actual_entitlements="$RUNNER_TEMP/couchcoop-godot-entitlements.plist"
          codesign --display --entitlements :- "$signed_app" >"$actual_entitlements" 2>/dev/null
          for key in allow-jit allow-unsigned-executable-memory allow-dyld-environment-variables disable-executable-page-protection disable-library-validation; do
            test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.$key" "$actual_entitlements")" = true
          done
          plutil -convert json -o - "$actual_entitlements" | jq -e 'keys == [
            "com.apple.security.cs.allow-dyld-environment-variables",
            "com.apple.security.cs.allow-jit",
            "com.apple.security.cs.allow-unsigned-executable-memory",
            "com.apple.security.cs.disable-executable-page-protection",
            "com.apple.security.cs.disable-library-validation"
          ]' >/dev/null
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$actual_entitlements" >/dev/null 2>&1; then
            echo 'get-task-allow must not be present' >&2
            exit 1
          fi
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- \
            --godot-harmony-fixture "$signed_app/Contents/MacOS/Godot" "$COUCHCOOP_GODOT_FIXTURE"

      - name: Build and validate the production snapshot package
        timeout-minutes: 55
        working-directory: sources/sts2-couch-coop
        run: scripts/package-release.sh --snapshot

      - name: Recheck the snapshot beneath a path containing spaces
        timeout-minutes: 6
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          set -- dist/couchcoop-snapshot-*.zip
          test "$#" -eq 1 && test -f "$1"
          archive="$1"
          extracted="$RUNNER_TEMP/CouchCoop package verification"
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          version="$(jq -er '.version' "$extracted/couchcoop/couchcoop.json")"
          scripts/verify-release-archive.sh --payload "$extracted/couchcoop" --version "$version" \
            --lane stable --lane public-beta --complete
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- --verify-archive "$archive"

      - name: Run iPhone 13 Simulator Safari survival contract
        timeout-minutes: 25
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          artifact_dir="$PWD/.ci-artifacts/iphone-safari-arm/field-repro"
          harness_out="$RUNNER_TEMP/couchcoop-iphone-harness.out"
          harness_err="$RUNNER_TEMP/couchcoop-iphone-harness.err"
          mkdir -p "$artifact_dir"
          dotnet run --project tests/CouchCoop.HostedServerHarness -c Release \
            -p:Sts2AssembliesDir="$RUNNER_TEMP/couchcoop-reference-sdk/stable" \
            -p:CouchCoopBuildToLocalMods=false -- \
            --static-root "$RUNNER_TEMP/CouchCoop package verification/couchcoop/frontend" \
            --port 23339 --mode iphone-burst --iphone-profile field-repro --artifact-dir "$artifact_dir" \
            >"$harness_out" 2>"$harness_err" &
          harness_pid=$!
          trap 'kill "$harness_pid" >/dev/null 2>&1 || true' EXIT HUP INT TERM
          poll=0
          while [ "$poll" -lt 120 ] && ! grep -q '"baseUrl"' "$harness_out"; do
            kill -0 "$harness_pid" >/dev/null 2>&1 || { sed -n '1,40p' "$harness_err" >&2; exit 1; }
            sleep 1
            poll=$((poll + 1))
          done
          harness_url="$(grep '"baseUrl"' "$harness_out" | tail -n 1 | jq -er '.baseUrl')"
          scripts/run-iphone-safari-simulator.sh --artifact-dir "$artifact_dir" \
            --harness-url "$harness_url" --iphone-profile field-repro

      - name: Validate staged ARM Simulator diagnostics
        timeout-minutes: 2
        id: validate_arm_artifacts
        if: always()
        working-directory: sources/sts2-couch-coop
        run: node scripts/validate-iphone-artifact-stage.mjs safari .ci-artifacts/iphone-safari-arm/field-repro

      - name: Verify stock Godot honors a fake HOME
        timeout-minutes: 5
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          fake_home="$RUNNER_TEMP/couchcoop-godot-fake-home"
          output="$RUNNER_TEMP/couchcoop-godot-user-dir.log"
          mkdir -p "$fake_home"
          HOME="$fake_home" "$COUCHCOOP_GODOT_EXECUTABLE" --headless \
            --path "$PWD/tests/CouchCoop.MacOs.UserDirProbe" --script res://probe.gd >"$output" 2>&1
          marker="$(grep '^COUCHCOOP_USER_DIR_JSON=' "$output")"
          actual="$(printf '%s' "${marker#COUCHCOOP_USER_DIR_JSON=}" | jq -er '.userDir')"
          test "$actual" = "$fake_home/Library/Application Support/SlayTheSpire2"

      - name: Upload staged ARM Simulator diagnostics
        timeout-minutes: 3
        if: ${{ always() && steps.validate_arm_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphone-safari-arm-synthetic-${{ github.run_id }}
          path: sources/sts2-couch-coop/.ci-artifacts/iphone-safari-arm
          if-no-files-found: ignore
          retention-days: 3

  macos_intel:
    needs: [policy, iphone_webkit]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_intel == true }}
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - name: Pin a scratch mod directory
        timeout-minutes: 1
        run: echo "COUCHCOOP_GAME_MODS_DIR=$RUNNER_TEMP/couchcoop-mods" >> "$GITHUB_ENV"

      - name: Check out source without credentials
        timeout-minutes: 3
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: sources/sts2-couch-coop
          fetch-depth: 0
          persist-credentials: false

      - name: Clone pinned public release sources
        timeout-minutes: 8
        working-directory: sources
        run: |
          set -euo pipefail
          pins=sts2-couch-coop/release-dependencies.json
          for name in spirectl godot-scene-web; do
            url="$(jq -er --arg name "$name" '.dependencies[$name].repository' "$pins")"
            commit="$(jq -er --arg name "$name" '.dependencies[$name].commit' "$pins")"
            git clone --quiet "$url" "$name"
            git -C "$name" checkout --quiet --detach "$commit"
            test "$(git -C "$name" rev-parse HEAD)" = "$commit"
          done

      - name: Set up .NET
        timeout-minutes: 4
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node
        timeout-minutes: 4
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'

      - name: Download the pinned universal Godot .NET runtime
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v4.5.1-stable_mono_macos.universal.zip"
          godot_root="$RUNNER_TEMP/godot-dotnet-4.5.1"
          curl --fail --location --retry 3 --retry-all-errors --retry-max-time 1200 \
            --connect-timeout 15 --max-time 900 --output "$archive" \
            https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_macos.universal.zip
          expected_sha=f00ee565e9d3682584117ef8865f5ff6d8f571fbf2733075ee06b9e0953261b8
          test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$expected_sha"
          mkdir -p "$godot_root"
          unzip -q "$archive" -d "$godot_root"
          godot_count="$(find "$godot_root" -type f -path '*/Contents/MacOS/Godot' | wc -l | tr -d ' ')"
          test "$godot_count" -eq 1
          godot_executable="$(find "$godot_root" -type f -path '*/Contents/MacOS/Godot')"
          godot_app="${godot_executable%/Contents/MacOS/Godot}"
          test -x "$godot_executable"
          echo "COUCHCOOP_GODOT_EXECUTABLE=$godot_executable" >> "$GITHUB_ENV"
          echo "COUCHCOOP_GODOT_APP=$godot_app" >> "$GITHUB_ENV"

      - name: Audit portable package fixtures and pinned reference lanes
        timeout-minutes: 15
        working-directory: sources/sts2-couch-coop
        run: |
          scripts/verify-sts2-reference-sdk.sh stable public-beta
          scripts/test-verify-release-archive.sh
          scripts/test-macos-support-diagnostics.sh
          scripts/test-iphone-safari-simulator.sh

      - name: Build reference SDKs and public runtime fixtures
        timeout-minutes: 20
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/couchcoop-reference-sdk"
          for lane in stable public-beta; do
            dotnet build "eng/Sts2.ReferenceSdk/$lane/Sts2.ReferenceSdk.$lane.csproj" \
              -c Release -o "$sdk_root/$lane" -p:RestoreLockedMode=true
          done
          dotnet run --project tests/CouchCoop.HostedServerHarness -c Release \
            -p:Sts2AssembliesDir="$sdk_root/stable" -p:Sts2GameApi=v107 \
            -p:CouchCoopBuildToLocalMods=false -- \
            --mode iphone-burst-self-test
          dotnet build tests/CouchCoop.HarmonySmoke/CouchCoop.HarmonySmoke.csproj \
            -c Release -o "$RUNNER_TEMP/couchcoop-harmony-smoke" \
            -p:RestoreLockedMode=true -p:CouchCoopBuildToLocalMods=false
          dotnet restore tests/CouchCoop.MacOs.GodotHarmonyFixture/CouchCoop.MacOs.GodotHarmonyFixture.csproj \
            --locked-mode
          dotnet build tests/CouchCoop.MacOs.GodotHarmonyFixture/CouchCoop.MacOs.GodotHarmonyFixture.csproj \
            -c Release --no-restore
          fixture_stage="$RUNNER_TEMP/CouchCoop Godot Harmony fixture"
          ditto tests/CouchCoop.MacOs.GodotHarmonyFixture "$fixture_stage"
          test -f "$fixture_stage/.godot/mono/temp/bin/Release/CouchCoop.MacOs.GodotHarmonyFixture.dll"
          echo "COUCHCOOP_GODOT_FIXTURE=$fixture_stage" >> "$GITHUB_ENV"

      - name: Verify stable and public-beta lobby targets as metadata only
        timeout-minutes: 10
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          project=tests/CouchCoop.Mod.Tests/CouchCoop.Mod.Tests.csproj
          metadata_obj="$RUNNER_TEMP/couchcoop-beta-targets/obj/"
          metadata_bin="$RUNNER_TEMP/couchcoop-beta-targets/bin/"
          dotnet restore "$project" \
            -p:CouchCoopBetaTargetsMode=metadata \
            -p:CouchCoopLocalConfigPath="$RUNNER_TEMP/no-local-game-config.yaml" \
            -p:BaseIntermediateOutputPath="$metadata_obj" \
            -p:BaseOutputPath="$metadata_bin"
          dotnet run --project "$project" -c Release --no-restore \
            -p:CouchCoopBetaTargetsMode=metadata -p:Sts2GameApi=v107 \
            -p:CouchCoopLocalConfigPath="$RUNNER_TEMP/no-local-game-config.yaml" \
            -p:BaseIntermediateOutputPath="$metadata_obj" -p:BaseOutputPath="$metadata_bin" -- \
            beta-targets "$RUNNER_TEMP/couchcoop-reference-sdk/stable/sts2.dll"
          dotnet run --project "$project" -c Release --no-restore \
            -p:CouchCoopBetaTargetsMode=metadata -p:Sts2GameApi=v111 \
            -p:CouchCoopLocalConfigPath="$RUNNER_TEMP/no-local-game-config.yaml" \
            -p:BaseIntermediateOutputPath="$metadata_obj" -p:BaseOutputPath="$metadata_bin" -- \
            beta-targets "$RUNNER_TEMP/couchcoop-reference-sdk/public-beta/sts2.dll"

      - name: Run game-free macOS and Harmony checks
        timeout-minutes: 15
        working-directory: sources/sts2-couch-coop
        run: |
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- \
            --harmony-smoke "$RUNNER_TEMP/couchcoop-harmony-smoke/CouchCoop.HarmonySmoke"
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- \
            --godot-harmony-fixture "$COUCHCOOP_GODOT_EXECUTABLE" "$COUCHCOOP_GODOT_FIXTURE"

      - name: Run the ad-hoc hardened Godot .NET fixture
        timeout-minutes: 15
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          signed_root="$RUNNER_TEMP/CouchCoop hardened Godot"
          signed_app="$signed_root/$(basename "$COUCHCOOP_GODOT_APP")"
          mkdir -p "$signed_root"
          ditto "$COUCHCOOP_GODOT_APP" "$signed_app"
          codesign --force --deep --sign - --options runtime \
            --entitlements tests/CouchCoop.MacOs.GodotHarmonyFixture/hardened-runtime.entitlements.plist \
            "$signed_app"
          codesign --verify --deep --strict "$signed_app"
          signature="$RUNNER_TEMP/couchcoop-godot-signature.txt"
          codesign --display --verbose=4 "$signed_app" >"$signature" 2>&1
          grep -Fq 'Signature=adhoc' "$signature"
          grep -Eq '^CodeDirectory .*flags=.*\([^)]*runtime[^)]*\)' "$signature"
          actual_entitlements="$RUNNER_TEMP/couchcoop-godot-entitlements.plist"
          codesign --display --entitlements :- "$signed_app" >"$actual_entitlements" 2>/dev/null
          for key in allow-jit allow-unsigned-executable-memory allow-dyld-environment-variables disable-executable-page-protection disable-library-validation; do
            test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.$key" "$actual_entitlements")" = true
          done
          plutil -convert json -o - "$actual_entitlements" | jq -e 'keys == [
            "com.apple.security.cs.allow-dyld-environment-variables",
            "com.apple.security.cs.allow-jit",
            "com.apple.security.cs.allow-unsigned-executable-memory",
            "com.apple.security.cs.disable-executable-page-protection",
            "com.apple.security.cs.disable-library-validation"
          ]' >/dev/null
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$actual_entitlements" >/dev/null 2>&1; then
            echo 'get-task-allow must not be present' >&2
            exit 1
          fi
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- \
            --godot-harmony-fixture "$signed_app/Contents/MacOS/Godot" "$COUCHCOOP_GODOT_FIXTURE"

      - name: Build and validate the production snapshot package
        timeout-minutes: 55
        working-directory: sources/sts2-couch-coop
        run: scripts/package-release.sh --snapshot

      - name: Recheck the snapshot beneath a path containing spaces
        timeout-minutes: 6
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          set -- dist/couchcoop-snapshot-*.zip
          test "$#" -eq 1 && test -f "$1"
          archive="$1"
          extracted="$RUNNER_TEMP/CouchCoop package verification"
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          version="$(jq -er '.version' "$extracted/couchcoop/couchcoop.json")"
          scripts/verify-release-archive.sh --payload "$extracted/couchcoop" --version "$version" \
            --lane stable --lane public-beta --complete
          dotnet run --project tests/CouchCoop.MacOs.Tests -c Release -- --verify-archive "$archive"

      - name: Verify stock Godot honors a fake HOME
        timeout-minutes: 5
        working-directory: sources/sts2-couch-coop
        run: |
          set -euo pipefail
          fake_home="$RUNNER_TEMP/couchcoop-godot-fake-home"
          output="$RUNNER_TEMP/couchcoop-godot-user-dir.log"
          mkdir -p "$fake_home"
          HOME="$fake_home" "$COUCHCOOP_GODOT_EXECUTABLE" --headless \
            --path "$PWD/tests/CouchCoop.MacOs.UserDirProbe" --script res://probe.gd >"$output" 2>&1
          marker="$(grep '^COUCHCOOP_USER_DIR_JSON=' "$output")"
          actual="$(printf '%s' "${marker#COUCHCOOP_USER_DIR_JSON=}" | jq -er '.userDir')"
          test "$actual" = "$fake_home/Library/Application Support/SlayTheSpire2"
