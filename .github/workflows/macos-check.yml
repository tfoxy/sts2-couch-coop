          scripts/run-iphone-safari-simulator.sh --artifact-dir "$artifact_dir" --harness-url "$harness_url"

      - name: Validate staged Intel Simulator diagnostics
        timeout-minutes: 2
        id: validate_intel_artifacts
        if: always()
        working-directory: sources/sts2-couch-coop
        run: node scripts/validate-iphone-artifact-stage.mjs safari .ci-artifacts/iphone-safari-intel

