; Export presets for the CouchCoop native Godot client.
;
; BEST-EFFORT, HAND-AUTHORED for Godot 4.5 — opening the project in the Godot editor and touching the
; Export dialog WILL NORMALIZE / REWRITE this file (fill in every option key with its default, reorder,
; drop unknown keys). Treat this as a seed, not a source of truth.
;
; CLEARTEXT TRAFFIC NOTE (load-bearing for the mirror path): the client connects to the host over PLAIN
; ws:// + http:// on the LAN (no TLS). Android 9+ blocks cleartext by default. Godot 4.5's Android export
; preset does NOT expose a `usesCleartextTraffic` option key, so it CANNOT be set here. It must be set in
; the gradle custom-build template's AndroidManifest.xml:
;     res://android/build/AndroidManifest.xml  ->  <application ... android:usesCleartextTraffic="true">
; (Install the build template via Editor > Project > Install Android Build Template, then edit the manifest.)
; See README.md "Android export recipe" for the full recipe. `permissions/internet=true` below grants the
; INTERNET permission the socket needs, but cleartext is a separate manifest flag.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="dist/couchcoop-client.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0.0"
package/unique_name="com.couchcoop.client"
package/name="STS2 CouchCoop"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
; DISTRIBUTABLE default: NO baked args — the app launches to the Connect screen (host entry, persisted).
; For a bench/soak build, temporarily set e.g. "-- --connect <host>:13337 --name Phone --duration 300 --bench"
; (user args MUST start with "-- "). scripts/build-android-apk.sh refuses to build while args are baked.
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/internet=true
permissions/access_network_state=true

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="dist/couchcoop-client.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

