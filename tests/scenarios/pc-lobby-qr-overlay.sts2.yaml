name: pc-lobby-qr-overlay
description: >-
  Validates the in-game CouchCoop QR host panel on the PC host lobby: the "Couch Co-Op QR Code"
  button at its contract rect on BOTH lobby screens, the host-select dialog it opens (mDNS default,
  option switch re-renders the QR), that the open dialog blocks lobby input without removing semantic
  actions, both close paths, and that no CouchCoopQr* node ever reaches a mirror client.

steps:
  # Builds via game.deployBuildCommand into <repo>/dist/couchcoop, deploys that into the game's mods
  # dir, then restarts and verifies the bridge -- so the probe always runs against the current tree.
  - game.deploy:
      path: ../../src/CouchCoop.Mod.Loader
      build: true
      restart: true
      verify: true
      timeoutMs: 120000

  # The probe loads its own fixtures (host lobby, load-run host lobby, main menu) and takes the
  # shared live-session lock itself.
  # The restarted game keeps finishing its own boot flow (logo / FTUE / leaderboard) for several
  # seconds, and that flow pushes the main menu -- popping any lobby a fixture created in the
  # meantime. Let it settle before the probe starts driving screens.
  - dev.delay:
      ms: 20000

  - project.hook:
      name: couchcoop.pc-lobby-qr-overlay-probe
