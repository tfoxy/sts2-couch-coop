name: pc-lobby-activity-log
description: >-
  Validates the in-game CouchCoop host connectivity log on the PC host lobby: that events are RECORDED
  while the panel is invisible (main menu) and are already there when a lobby opens, the panel's node
  contract and its clearance of the game's own ReleaseInfo version label on both lobby screens, the
  negative gates (singleplayer character select, main menu, in-run), the collapse toggle surviving a
  screen change, scrolling past the visible row count, and that no CouchCoopActivity* node -- nor any
  player name the log carries -- ever reaches a mirror client.

steps:
  # Builds via game.deployBuildCommand into <repo>/dist/couchcoop, deploys that into the game's mods
  # dir, then restarts and verifies the bridge -- so the probe always runs against the current tree.
  - game.deploy:
      path: ../../src/CouchCoop.Mod.Loader
      build: true
      restart: true
      verify: true
      timeoutMs: 120000

  # The probe loads its own fixtures (host lobby, load-run host lobby, singleplayer lobby, main menu)
  # and takes the shared live-session lock itself.
  # The restarted game keeps finishing its own boot flow (logo / FTUE / leaderboard) for several
  # seconds, and that flow pushes the main menu -- popping any lobby a fixture created in the
  # meantime. Let it settle before the probe starts driving screens.
  - dev.delay:
      ms: 20000

  - project.hook:
      name: couchcoop.pc-lobby-activity-log-probe
